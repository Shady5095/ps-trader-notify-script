services:
  - type: web
    name: ps5-dubizzle-radar
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CHECK_INTERVAL_MINUTES
        value: "5"
